<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redis Chat — Real-Time Live Stream</title>
    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --bg-card: #334155;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent: #38bdf8;
            --accent-green: #22c55e;
            --accent-red: #ef4444;
            --border: #475569;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 850px;
            margin: 0 auto;
            width: 100%;
            display: flex;
            flex-direction: column;
            flex: 1;
        }
        header {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 16px;
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .brand h1 {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-primary);
        }
        .brand span {
            color: var(--accent);
        }
        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background-color: rgba(34, 197, 94, 0.15);
            color: var(--accent-green);
            padding: 6px 14px;
            border-radius: 9999px;
            font-size: 0.85rem;
            font-weight: 600;
            border: 1px solid rgba(34, 197, 94, 0.3);
        }
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: var(--accent-green);
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(1.3); }
            100% { opacity: 1; transform: scale(1); }
        }
        .room-bar {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
        }
        .room-bar label {
            font-size: 0.9rem;
            color: var(--text-secondary);
            font-weight: 600;
        }
        .room-bar input {
            background-color: var(--bg-primary);
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.95rem;
            flex: 1;
        }
        .room-bar button {
            background-color: var(--accent);
            color: #000;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .room-bar button:hover {
            opacity: 0.9;
        }
        .chat-feed {
            flex: 1;
            background-color: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            overflow-y: auto;
            min-height: 420px;
            max-height: 600px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-bottom: 16px;
        }
        .empty-state {
            margin: auto;
            text-align: center;
            color: var(--text-secondary);
        }
        .message-bubble {
            background-color: var(--bg-card);
            border-radius: 12px;
            padding: 12px 16px;
            max-width: 85%;
            align-self: flex-start;
            border: 1px solid rgba(255, 255, 255, 0.05);
            animation: fadeIn 0.3s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .message-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 4px;
        }
        .message-sender {
            font-weight: 700;
            color: var(--accent);
            font-size: 0.9rem;
        }
        .message-time {
            font-size: 0.75rem;
            color: var(--text-secondary);
        }
        .message-body {
            font-size: 0.95rem;
            line-height: 1.45;
            color: var(--text-primary);
            word-break: break-word;
        }
        .send-bar {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 14px 16px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .send-bar input.sender-input {
            width: 140px;
            background-color: var(--bg-primary);
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 0.95rem;
        }
        .send-bar input.msg-input {
            flex: 1;
            min-width: 220px;
            background-color: var(--bg-primary);
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 0.95rem;
        }
        .send-bar button {
            background-color: var(--accent-green);
            color: #000;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .send-bar button:hover {
            opacity: 0.9;
        }
        footer {
            margin-top: 14px;
            text-align: center;
            color: var(--text-secondary);
            font-size: 0.85rem;
            display: flex;
            justify-content: center;
            gap: 16px;
        }
        footer a {
            color: var(--accent);
            text-decoration: none;
        }
        footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="brand">
                <h1>⚡ Redis Chat <span>Live Stream</span></h1>
            </div>
            <div id="statusPill" class="status-pill">
                <div id="statusDot" class="status-dot"></div>
                <span id="statusText">Connecting to Stream...</span>
            </div>
        </header>

        <div class="room-bar">
            <label for="roomInput">Channel / Room:</label>
            <input type="text" id="roomInput" value="tech" placeholder="e.g. tech, general">
            <button onclick="switchRoom()">Connect Room</button>
        </div>

        <div id="chatFeed" class="chat-feed">
            <div id="emptyNotice" class="empty-state">
                <p>Connecting to live Redis Pub/Sub stream...</p>
                <p style="font-size: 0.8rem; margin-top: 6px;">Messages published to this room will appear here in real time.</p>
            </div>
        </div>

        <div class="send-bar">
            <input type="text" id="senderInput" class="sender-input" placeholder="Your name (e.g. Alice)" value="Alice">
            <input type="text" id="msgInput" class="msg-input" placeholder="Type a message and hit Enter..." onkeypress="handleKey(event)">
            <button onclick="sendMessage()">Send Live</button>
        </div>

        <footer>
            <span>Powered by Spring Boot 3 + Redis Pub/Sub</span>
            <span>•</span>
            <a href="/swagger-ui/index.html" target="_blank">Swagger UI</a>
            <span>•</span>
            <a href="/health" target="_blank">Health Check</a>
        </footer>
    </div>

    <script>
        let eventSource = null;
        let currentRoom = "tech";

        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get("room")) {
            currentRoom = urlParams.get("room").trim().toLowerCase();
            document.getElementById("roomInput").value = currentRoom;
        }

        function switchRoom() {
            const inputVal = document.getElementById("roomInput").value.trim().toLowerCase();
            if (!inputVal) return;
            currentRoom = inputVal;
            const newUrl = window.location.pathname + "?room=" + encodeURIComponent(currentRoom);
            window.history.pushState({}, "", newUrl);
            connectStream(currentRoom);
        }

        function connectStream(roomId) {
            if (eventSource) {
                eventSource.close();
            }

            const chatFeed = document.getElementById("chatFeed");
            chatFeed.innerHTML = '<div class="empty-state"><p>Listening for real-time messages on <b>chatroom:' + escapeHtml(roomId) + ':channel</b>...</p></div>';

            const statusText = document.getElementById("statusText");
            const statusDot = document.getElementById("statusDot");
            const statusPill = document.getElementById("statusPill");

            statusText.textContent = "Connecting to " + roomId + "...";
            statusDot.style.backgroundColor = "#eab308";
            statusPill.style.color = "#eab308";

            // First load past history
            fetch('/api/chatapp/chatrooms/' + encodeURIComponent(roomId) + '/messages?limit=20')
                .then(res => res.ok ? res.json() : null)
                .then(data => {
                    if (data && data.messages && data.messages.length > 0) {
                        chatFeed.innerHTML = '';
                        data.messages.forEach(msg => appendMessage(msg));
                    }
                })
                .catch(() => {});

            // Connect to live SSE endpoint
            const streamUrl = '/api/chatapp/chatrooms/' + encodeURIComponent(roomId) + '/stream';
            eventSource = new EventSource(streamUrl);

            eventSource.addEventListener("connected", function(e) {
                statusText.textContent = "Live: " + roomId + " (Redis Pub/Sub)";
                statusDot.style.backgroundColor = "var(--accent-green)";
                statusPill.style.color = "var(--accent-green)";
                statusPill.style.borderColor = "rgba(34, 197, 94, 0.3)";
            });

            eventSource.addEventListener("message", function(e) {
                try {
                    const payload = JSON.parse(e.data);
                    appendMessage(payload);
                } catch(err) {
                    console.error("Failed to parse event:", e.data);
                }
            });

            eventSource.onerror = function() {
                statusText.textContent = "Reconnecting...";
                statusDot.style.backgroundColor = "var(--accent-red)";
                statusPill.style.color = "var(--accent-red)";
                statusPill.style.borderColor = "rgba(239, 68, 68, 0.3)";
            };
        }

        function appendMessage(msg) {
            const chatFeed = document.getElementById("chatFeed");
            const emptyNotice = document.getElementById("emptyNotice");
            if (emptyNotice) emptyNotice.remove();

            const bubble = document.createElement("div");
            bubble.className = "message-bubble";

            const timeStr = msg.timestamp ? new Date(msg.timestamp).toLocaleTimeString() : new Date().toLocaleTimeString();

            bubble.innerHTML = `
                <div class="message-header">
                    <span class="message-sender">${escapeHtml(msg.participant || 'Anonymous')}</span>
                    <span class="message-time">${escapeHtml(timeStr)}</span>
                </div>
                <div class="message-body">${escapeHtml(msg.message || '')}</div>
            `;

            chatFeed.appendChild(bubble);
            chatFeed.scrollTop = chatFeed.scrollHeight;
        }

        async function sendMessage() {
            const senderInput = document.getElementById("senderInput");
            const msgInput = document.getElementById("msgInput");
            const participant = senderInput.value.trim();
            const message = msgInput.value.trim();

            if (!participant || !message) return;

            // Auto-join if needed
            await fetch('/api/chatapp/chatrooms/' + encodeURIComponent(currentRoom) + '/join', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ participant: participant })
            }).catch(() => {});

            // Send message
            const res = await fetch('/api/chatapp/chatrooms/' + encodeURIComponent(currentRoom) + '/messages', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ participant: participant, message: message })
            });

            if (res.ok) {
                msgInput.value = '';
            } else {
                const err = await res.json().catch(() => ({}));
                alert(err.message || "Failed to send message");
            }
        }

        function handleKey(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        }

        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        // Auto-connect on page load
        connectStream(currentRoom);
    </script>
</body>
</html>
