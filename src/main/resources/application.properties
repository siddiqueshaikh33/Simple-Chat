spring.application.name=chatapp

# Server Port (supports cloud platforms like Railway, Render, etc.)
server.port=${PORT:8080}

# Redis Configuration (supports local, cloud URI, host/port, password, SSL)
spring.data.redis.url=${REDIS_URL:}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${REDIS_SSL:false}
spring.data.redis.timeout=3000ms

# Swagger / OpenAPI Documentation
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
