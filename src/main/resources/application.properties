spring.application.name=chatapp

# Server Port (supports cloud platforms like Railway, Render, etc.)
server.port=${PORT:8080}

# Redis Configuration (supports local, cloud URI, host/port, password, SSL)
# Fallback hierarchy supporting Railway's default env vars (REDISHOST, REDISPORT, REDISPASSWORD)
spring.data.redis.host=${REDIS_HOST:${REDISHOST:localhost}}
spring.data.redis.port=${REDIS_PORT:${REDISPORT:6379}}
spring.data.redis.password=${REDIS_PASSWORD:${REDISPASSWORD:}}
spring.data.redis.ssl.enabled=${REDIS_SSL:false}
spring.data.redis.timeout=3000ms

# Swagger / OpenAPI Documentation
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
